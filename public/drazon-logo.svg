<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="drazon-orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <linearGradient id="drazon-dark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="drazon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer White Sticker / Outline Border for the emblem -->
  <g transform="translate(0, 0)">
    <!-- White backing outline -->
    <path d="M 72 45 
             C 80 44, 85 47, 86 52 
             C 83 55, 78 57, 72 57
             C 63 65, 57 73, 62 83
             C 54 85, 45 80, 40 73
             C 33 63, 33 50, 40 40
             C 34 38, 30 33, 32 28
             C 38 31, 44 34, 48 37
             C 43 32, 38 25, 40 20
             C 48 24, 57 29, 65 37
             C 70 41, 71 44, 72 45 Z" 
          fill="#FFFFFF" 
          stroke="#FFFFFF" 
          stroke-width="5" 
          stroke-linejoin="round" />

    <!-- Orange Curved Accent Arc -->
    <path d="M 39 42 
             C 32 52, 32 65, 43 75 
             C 48 79, 53 81, 58 81
             C 52 79, 46 76, 42 71
             C 36 63, 36 52, 43 43 Z" 
          fill="url(#drazon-orange-grad)" />

    <!-- Main Black Dragon Head & Neck Body -->
    <path d="M 72 45 
             C 80 44, 84 48, 85 52 
             C 82 55, 77 56, 71 56
             C 61 63, 56 71, 61 82
             C 54 83, 46 78, 42 72
             C 36 62, 37 50, 44 41
             C 39 39, 34 34, 35 29
             C 41 32, 46 35, 50 38
             C 45 33, 41 27, 43 21
             C 50 25, 58 30, 65 37
             C 70 41, 71 44, 72 45 Z" 
          fill="#0F172A" 
          stroke="#1E293B" 
          stroke-width="1.5" />

    <!-- Sharp Dragon Eye Slit (White) -->
    <polygon points="68,43 74,45 69,47" fill="#FFFFFF" />
  </g>
</svg>
